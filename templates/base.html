<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema HCE Biomédico{% endblock %}</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Roboto y Open Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Open+Sans:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f4f8;
        }
        .navbar-brand {
            font-weight: 700;
            color: #0a4275 !important;
        }
        .navbar-brand i {
            color: #4fc3f7;
        }
        .nav-link {
            color: #0a4275 !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: #4fc3f7 !important;
        }
        .card-custom {
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: none;
            transition: transform 0.3s;
        }
        .card-custom:hover {
            transform: translateY(-5px);
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #0a4275, #4fc3f7);
            border: none;
            color: white;
            border-radius: 30px;
            padding: 10px 25px;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #08315a, #3aa8d4);
            color: white;
        }
        .footer {
            background: #0a4275;
            color: white;
            padding: 20px 0;
            margin-top: 40px;
        }
        .footer a {
            color: #4fc3f7;
            text-decoration: none;
        }
        .header-logo {
            font-size: 2rem;
            color: #0a4275;
        }
        .badge-tech {
            background: #4fc3f7;
            color: #0a4275;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="{% url 'lista_pacientes' %}">
                <i class="fas fa-heartbeat me-2"></i> <span style="color:#0a4275;">HCE</span><span style="color:#4fc3f7;">Biomed</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'lista_pacientes' %}"><i class="fas fa-list me-1"></i> Pacientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'registrar_paciente' %}"><i class="fas fa-user-plus me-1"></i> Nuevo</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'buscar_paciente' %}"><i class="fas fa-search me-1"></i> Buscar</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin"><i class="fas fa-lock me-1"></i> Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Footer -->
    <div class="footer text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 HCEBiomed - Sistema de Historias Clínicas Electrónicas</p>
            <p class="mb-0"><small><i class="fas fa-shield-alt me-1"></i> Tecnología segura para la salud</small></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
